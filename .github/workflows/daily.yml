name: disclosure-tracker
on:
  schedule: [{ cron: "0 5,14,22 * * *" }]   # 08:00, 17:00, 01:00 Istanbul
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Sadece Telegram test mesajı gönder"
        type: boolean
        default: false
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: tracker, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r requirements.txt
      - name: telegram test
        if: ${{ inputs.test_telegram }}
        run: python -m tracker.main --test-telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: check filings
        if: ${{ !inputs.test_telegram }}
        run: |
          # first ever run: fill history without spamming Telegram
          if [ ! -f data/tracker.db ]; then python -m tracker.main --silent --years 2025 2026 --export;
          else python -m tracker.main --export; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: save state
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name tracker-bot && git config user.email bot@users.noreply.github.com
          git add data/ && (git diff --cached --quiet || git commit -m "update disclosures") && git push
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !inputs.test_telegram }}
        with: { path: site }
      - id: deploy
        if: ${{ !inputs.test_telegram }}
        uses: actions/deploy-pages@v5
